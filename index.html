<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#C23444">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="description" content="Studeo — apprends du vocabulaire anglais en t'amusant.">

<title>Studeo</title>

<!-- iPhone en mode application (écran d'accueil) : classe utilisée par style.css pour dimensionner la
     coquille (la fenêtre annoncée par iOS est 62 pt trop courte, voir style.css et CLAUDE.md §5.44).
     Script volontairement en ligne et immédiat : la classe doit exister avant le premier rendu. -->
<script>if (window.navigator.standalone === true) document.documentElement.classList.add("ios-app");</script>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<link rel="icon" href="./assets/icons/icon-192.png">

<!-- Images de démarrage iPhone (une par taille d'écran, lues à l'installation sur l'écran d'accueil).
     Sans image correspondant à l'appareil, iOS peut faire tourner l'app installée dans une fenêtre
     plus petite que l'écran (bande vide en bas, mesurée sur iPhone 17 Pro : 812 pt sur 874). -->
<link rel="apple-touch-startup-image" href="./assets/splash/splash-1206x2622.png" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="./assets/splash/splash-1320x2868.png" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="./assets/splash/splash-1179x2556.png" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="./assets/splash/splash-1290x2796.png" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="./assets/splash/splash-1170x2532.png" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="./assets/splash/splash-1284x2778.png" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="./assets/splash/splash-1125x2436.png" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="./assets/splash/splash-1242x2688.png" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="./assets/splash/splash-828x1792.png" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

<!-- Polices : Baloo 2 pour les titres (rond, ludique), Nunito pour le texte courant -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div id="app-shell">
  <div id="fond-actif" aria-hidden="true"></div>
  <div id="app-view" role="main"></div>
</div>

</html>
